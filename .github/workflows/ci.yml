name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --omit=dev
      - run: npm run validate
      - run: npm pack --dry-run
      - run: sh -n scripts/*.sh
      - run: ./scripts/test-shell-installation.sh

  test-windows:
    name: test-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - shell: bash
        run: npm ci --ignore-scripts --omit=dev
      - shell: bash
        run: npm run validate
      - shell: bash
        run: npm pack --dry-run

  test-macos:
    name: test-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --omit=dev
      - run: npm run validate
      - run: npm pack --dry-run
      - run: sh -n scripts/*.sh
      - run: ./scripts/test-shell-installation.sh

  # tsc --checkJs against the committed baseline: fails only on new type errors.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # The staged package (TypeScript shipped as JavaScript) must pass the same checks and tests as the source.
  test-package:
    name: test-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --omit=dev
      - run: npm run build
      - run: node scripts/check-package.mjs --installed
        working-directory: build/package
      - run: npm test
        working-directory: build/package
      - run: npm pack ./build/package --dry-run

  # Bun stays supported for this release; the next minor drops it.
  test-bun:
    name: test-bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: npm ci --ignore-scripts --omit=dev
      - run: bun run validate:bun
      - run: AGENT_CONTEXT_BROKER_RUNTIME=bun ./scripts/test-shell-installation.sh
